[package]
name = "app"
version = "0.1.12"
description = "PWORK 个人工作台——本地优先的四模块个人操作系统"
authors = ["PWORK"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
# 内嵌网关（gateway.mjs 的 Rust 版）：tiny_http 同步小服务器 + ureq 同步上游代理
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# 主库文件化（08 设计 S2）：桌面版 SQLite 存储，bundled 自带编译无需系统库
rusqlite = { version = "0.32", features = ["bundled"] }
