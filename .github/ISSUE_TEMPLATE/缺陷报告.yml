name: 缺陷报告
description: 应用功能异常
labels: ["bug"]
body:
  - type: input
    id: env
    attributes:
      label: 环境（系统 + 版本）
      placeholder: "例：Windows 11 · 安装包 v0.1.10；或 Windows 11 · Chrome 网页版"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开… 2. 点击… 3. 出现…"
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望与实际
    validations:
      required: true
  - type: textarea
    id: errorlog
    attributes:
      label: 错误日志（设置 → 错误日志 → 导出，粘贴关键段）
      placeholder: "没有错误记录也可以留空"
