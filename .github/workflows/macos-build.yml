# macOS 构建工作流（macOS 版六步之①）：runner 上装 Rust + Node → tauri build →
# dmg/app/tar.gz + 更新器签名挂为构建工件，并发布到 GitHub Release v0.1.11（runner 内网上传，不受本机带宽影响）。
# 注意：tauri.conf.json 开了更新器工件（createUpdaterArtifacts），构建需要签名私钥——
# 仓库 Secrets 已配 TAURI_SIGNING_PRIVATE_KEY（私钥内容）与 TAURI_SIGNING_PRIVATE_KEY_PASSWORD（未配置即空密码）。
name: macos-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装 Rust 工具链
        run: |
          rustup set profile minimal
          rustup toolchain install stable --profile minimal

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 macOS 应用（app + dmg）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles app,dmg

      - name: 收集构建产物
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -name "*.dmg" -exec cp {} out/ \;
          find src-tauri/target/release/bundle -name "*.app" -maxdepth 2 -exec cp -R {} out/ \;
          find src-tauri/target/release/bundle -name "*.tar.gz" -exec cp {} out/ \;
          find src-tauri/target/release/bundle -name "*.sig" -exec cp {} out/ \; || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: pwork-macos
          path: app/out/
          if-no-files-found: error

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pwork-macos
          path: out

      - name: 生成更新器清单 latest.json 并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          SIG=$(cat out/PWORK.app.tar.gz.sig)
          URL="https://github.com/LoganLink0/pwork/releases/download/v${VERSION}/PWORK.app.tar.gz"
          printf '{ "version": "%s", "notes": "macOS 内测首包（Apple Silicon）。", "pub_date": "%s", "platforms": { "darwin-aarch64": { "signature": "%s", "url": "%s" } } }\n' \
            "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIG" "$URL" > latest.json
          cat latest.json
          # Release notes = 固定介绍 + CHANGELOG 对应版本段 + 下载表（保持历史 Release 的简短惯例，不贴发布说明全文）
          {
            echo "PWORK 是一个本地优先的个人工作台：你的速记、信息日报、任务、复盘全部保存在你自己的电脑上，不经过任何服务器。当前内测版本 ${VERSION}（0.x 表示内测期，未到正式定版）。"
            echo
            node -e "const fs=require('fs');const md=fs.readFileSync('CHANGELOG.md','utf8');const i=md.indexOf('## '+process.argv[1]);const j=md.indexOf('\n## ',i+1);process.stdout.write(i<0?'':md.slice(i,j>0?j:undefined).trim())" "${VERSION}"
            echo
            echo "## 下载"
            echo
            echo "| 资产 | 平台 | 说明 |"
            echo "|---|---|---|"
            echo "| \`PWORK_${VERSION}_aarch64.dmg\` | macOS（Apple Silicon） | 首次打开提示「已损坏」属 Gatekeeper 拦截未公证应用（macOS 15+）：双击一次后到 系统设置 → 隐私与安全性 点「仍要打开」，或终端执行 \`xattr -dr com.apple.quarantine /Applications/PWORK.app\` |"
            echo "| \`PWORK.app.tar.gz\` + \`latest.json\` | —— | 应用内自动更新的更新包与签名清单，手动安装用不到 |"
          } > release-notes.md
          gh release create "v${VERSION}" out/PWORK_${VERSION}_aarch64.dmg out/PWORK.app.tar.gz out/PWORK.app.tar.gz.sig latest.json \
            --title "PWORK ${VERSION}（内测）" \
            --notes-file release-notes.md \
          || gh release upload "v${VERSION}" out/* latest.json --clobber

