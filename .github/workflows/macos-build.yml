# macOS 构建工作流（macOS 版六步之①）：runner 上装 Rust + Node → tauri build →
# dmg/app/tar.gz + 更新器签名挂为构建工件，并发布到 GitHub Release v0.1.11（runner 内网上传，不受本机带宽影响）。
# 注意：tauri.conf.json 开了更新器工件（createUpdaterArtifacts），构建需要签名私钥——
# 仓库 Secrets 已配 TAURI_SIGNING_PRIVATE_KEY（私钥内容）与 TAURI_SIGNING_PRIVATE_KEY_PASSWORD（未配置即空密码）。
name: macos-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装 Rust 工具链
        run: |
          rustup set profile minimal
          rustup toolchain install stable --profile minimal

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 macOS 应用（app + dmg）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles app,dmg

      - name: 收集构建产物
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -name "*.dmg" -exec cp {} out/ \;
          find src-tauri/target/release/bundle -name "*.app" -maxdepth 2 -exec cp -R {} out/ \;
          find src-tauri/target/release/bundle -name "*.tar.gz" -exec cp {} out/ \;
          find src-tauri/target/release/bundle -name "*.sig" -exec cp {} out/ \; || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: pwork-macos
          path: app/out/
          if-no-files-found: error

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pwork-macos
          path: out

      - name: 生成更新器清单 latest.json 并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          SIG=$(cat out/PWORK.app.tar.gz.sig)
          URL="https://github.com/LoganLink0/pwork/releases/download/v${VERSION}/PWORK.app.tar.gz"
          printf '{ "version": "%s", "notes": "macOS 内测首包（Apple Silicon）。", "pub_date": "%s", "platforms": { "darwin-aarch64": { "signature": "%s", "url": "%s" } } }\n' \
            "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIG" "$URL" > latest.json
          cat latest.json
          gh release create "v${VERSION}" out/PWORK_0.1.11_aarch64.dmg out/PWORK.app.tar.gz out/PWORK.app.tar.gz.sig latest.json \
            --title "PWORK ${VERSION}（内测）" \
            --notes-file 发布说明.md \
          || gh release upload "v${VERSION}" out/* latest.json --clobber

