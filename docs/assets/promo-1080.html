<!--
  PWORK 朋友圈分享图模板（v3 版式）。含 __PWORK_VER__ / __PWORK_PLATFORM__ 两个占位符，
  由 tools/make-promo.mjs 注入并渲染出图（node tools/make-promo.mjs，输出自动递增 vN）。
  改版：直接编辑本文件的标题/六亮点文案，然后跑脚本；换中央实拍图替换 promo-app-crop.png。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f4f1; color: #2b2622;
    padding: 40px 56px 36px;
    display: flex; flex-direction: column;
  }
  /* 顶部 */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img.mark {
    width: 52px; height: 52px; display: block; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 10px rgba(43,38,34,.12);
  }
  .brand b { font-size: 28px; letter-spacing: 2px; }
  .badge { font-size: 17px; font-weight: 600; color: #b0500f; }
  .badge::before { content: "● "; font-size: 12px; vertical-align: 2px; }
  /* 标题 */
  h1 { font-size: 44px; line-height: 1.28; margin-top: 30px; letter-spacing: 1px; }
  h1 em { font-style: normal; color: #e0862c; }
  .sub { font-size: 20px; color: #6b635c; margin-top: 12px; }
  .sub b { color: #2b2622; }
  /* 中央实拍卡 */
  .shot {
    margin-top: 28px; background: #fff; border-radius: 14px;
    border: 1px solid #e5e1da; box-shadow: 0 4px 14px rgba(43,38,34,.06);
    overflow: hidden;
  }
  .shot img { display: block; width: 100%; }
  /* 六亮点 */
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 26px; }
  .cell {
    background: #fff; border-radius: 10px; border: 1px solid #e8e4dd;
    padding: 16px 18px 14px;
  }
  .cell h3 { font-size: 20px; display: flex; align-items: center; gap: 9px; }
  .cell h3::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--dot); }
  .cell p { font-size: 15px; color: #8a827a; margin-top: 4px; }
  /* 页脚 */
  .foot { margin-top: auto; padding-top: 24px; display: flex; align-items: center; justify-content: space-between; }
  .gh { display: flex; align-items: center; gap: 12px; }
  .linkmark {
    width: 40px; height: 40px; display: block;
    background: #fff; border-radius: 50%;
    box-shadow: 0 2px 10px rgba(43,38,34,.12);
  }
  .gh b { font-size: 22px; color: #2b2622; }
  .plat { font-size: 16px; color: #8a827a; }
  .plat b { color: #4a443e; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><img class="mark" src="logo-512.png" alt=""><b>PWORK</b></div>
    <div class="badge">开源免费 · 内测中</div>
  </div>

  <h1>我写了一个个人工作台软件，<em>数据只属于你</em></h1>
  <div class="sub"><b>输入、处理、输出、复盘</b>，四步一个循环——全部在你自己的电脑上运行</div>

  <div class="shot"><img src="promo-app-crop.png" alt=""></div>

  <div class="grid">
    <div class="cell" style="--dot:#4a7db5"><h3>四步闭环运转</h3><p>行动项自动回待办</p></div>
    <div class="cell" style="--dot:#4d9e6a"><h3>信息自动找上门</h3><p>80 源每天筛 10 条</p></div>
    <div class="cell" style="--dot:#d98e3a"><h3>成稿一键生成</h3><p>周报 PPT 自己汇</p></div>
    <div class="cell" style="--dot:#4a7db5"><h3>数据只在本地</h3><p>不上传可随时搬</p></div>
    <div class="cell" style="--dot:#4d9e6a"><h3>增强皆可选项</h3><p>AI 云端不配也全</p></div>
    <div class="cell" style="--dot:#d98e3a"><h3>开源免费可查</h3><p>MIT 全码开放</p></div>
  </div>

  <div class="foot">
    <div class="gh"><img class="linkmark" src="logo-link.png" alt=""><b>github.com/LoganLink0/pwork</b></div>
    <div class="plat">支持 <b>__PWORK_PLATFORM__</b> 系统（网页 / 桌面应用）· __PWORK_VER__</div>
  </div>
</body>
</html>
