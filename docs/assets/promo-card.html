<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #26221d; --ink-soft: #57524a; --ink-faint: #8a847a;
    --surface: #faf9f6; --surface-2: #f3f1ea; --line: #e4e0d6;
    --accent: #d98e3a; --accent-deep: #a05c1a; --bg: #f5f4f1;
  }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; flex-direction: column;
    padding: 56px 64px 40px;
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
  .brand .mark {
    width: 46px; height: 46px; border-radius: 12px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .brand .mark span { color: #fff; font-weight: 800; font-size: 26px; }
  .brand b { font-size: 26px; letter-spacing: 1px; }
  .brand .kicker { margin-left: auto; color: var(--accent-deep); font-weight: 700; font-size: 16px; }
  h1 { font-size: 52px; line-height: 1.25; margin-bottom: 14px; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { font-size: 22px; color: var(--ink-soft); margin-bottom: 30px; }
  .shot {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; margin-bottom: 30px;
  }
  .shot img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .proof {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2); border-left: 4px solid var(--accent);
    border-radius: 10px; padding: 16px 22px; font-size: 19px; color: var(--ink);
  }
  .proof b { color: var(--accent-deep); }
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 26px; font-size: 16px; color: var(--ink-faint);
  }
  .foot b { color: var(--ink-soft); font-size: 17px; }
</style>
</head>
<body>
  <div class="brand">
    <span class="mark"><span>P</span></span>
    <b>PWORK</b>
    <span class="kicker">开源免费 · 内测中</span>
  </div>
  <h1>__TITLE__</h1>
  <div class="sub">__SUB__</div>
  <div class="shot"><img src="__SHOT__"></div>
  <div class="proof">__PROOF__</div>
  <div class="foot">
    <b>github.com/LoganLink0/pwork</b>
    <span>支持 Windows 与 macOS（网页 / 桌面应用）· __PWORK_VER__</span>
  </div>
</body>
</html>
