name = "pwork-collect"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[triggers]
# 每小时触发一次；是否真抓由云端配置的「北京时间整点表」决定（默认 9/11/15/18/19/20/23）——
# 用户在应用 设置 → 云端同步 改抓取时间即生效（写 D1 config 表），不用改这里重新部署
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pwork-collect"
# 占位符：部署向导建库后自动回写真实 ID（database_id 单独无法访问数据库，但属于部署指纹，仓库不存真实值）。
# 已部署环境升级流程：npx wrangler d1 list --json 取回 uuid → node scripts/patch-toml.mjs database_id <uuid> → npx wrangler deploy → 提交前换回本占位符
database_id = "00000000-0000-0000-0000-000000000000"

# ── 配置（wrangler.toml 改 vars；密钥用 npx wrangler secret put）────────
[vars]
# 抓取 Token（写操作必须携带）与 LLM 代理口令均为 secret，不写在被 git 跟踪的 toml 里：
#   npx wrangler secret put TOKEN / npx wrangler secret put LLM_TOKEN
# AI 两级筛选（AD4：BYOK；不设 AI_API_KEY 则整链走规则评分，系统照常转）
AI_BASE_URL = "https://api.deepseek.com/v1"
AI_MODEL_CHEAP = "deepseek-flash"   # 4a 预筛（便宜模型）
AI_MODEL_STRONG = "deepseek-flash"  # 4b 评分打标（可配更强模型）
AI_DAILY_TOKEN_BUDGET = "300000"   # 每日 token 熔断（04 §10）
# 兴趣域配置（评分锚点，04 §4.2）：部署向导会问一遍并回写；仓库里只放中性默认值
INTERESTS = "科技动态,效率工具,行业观察"
DISLIKES = "广告软文,八卦娱乐"
CONTEXT = "我关注能直接用在工作和学习里的实用内容"

# secrets（不进 git，命令行设置）：
#   npx wrangler secret put AI_API_KEY
